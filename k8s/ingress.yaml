apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: express-mobile-ui-ingress
  namespace: express-mobile-ui
  labels:
    app: express-mobile-ui
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - express-mobile-ui.agilysys.com
    secretName: express-mobile-ui-tls
  rules:
  - host: express-mobile-ui.agilysys.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: express-mobile-ui-service
            port:
              number: 80
