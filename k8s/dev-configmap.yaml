apiVersion: v1
kind: ConfigMap
metadata:
  name: express-mobile-ui-config
  namespace: express-mobile-ui-dev
  labels:
    app: express-mobile-ui
    environment: development
data:
  # Development environment configuration
  environment: "development"
  api_url: "https://dev-api.agilysys.com"
  app_name: "Express Mobile UI (Dev)"
  # Additional configuration
  log_level: "debug"
  cache_ttl: "1800"
  session_timeout: "900"
