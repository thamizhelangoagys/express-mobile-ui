apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: express-mobile-checkin-hpa
  namespace: express-mobile-checkin
  labels:
    app: express-mobile-checkin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: express-mobile-checkin
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
