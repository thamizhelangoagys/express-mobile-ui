apiVersion: v1
kind: ConfigMap
metadata:
  name: express-mobile-ui-config
  namespace: express-mobile-ui
  labels:
    app: express-mobile-ui
data:
  # Environment-specific configuration
  environment: "production"
  api_url: "https://api.agilysys.com"
  app_name: "Express Mobile UI"
  # Additional configuration
  log_level: "info"
  cache_ttl: "3600"
  session_timeout: "1800"
