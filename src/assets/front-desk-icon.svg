<svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Counter -->
  <rect x="8" y="35" width="44" height="8" rx="2" fill="#E3F2FD"/>
  <rect x="8" y="35" width="44" height="8" rx="2" stroke="#1976D2" stroke-width="1"/>
  
  <!-- Staff member behind counter -->
  <circle cx="20" cy="25" r="6" fill="#FFB74D"/>
  <rect x="16" y="31" width="8" height="12" rx="4" fill="#1976D2"/>
  
  <!-- Guest in front of counter -->
  <circle cx="40" cy="30" r="5" fill="#FFB74D"/>
  <rect x="37" y="35" width="6" height="10" rx="3" fill="#4CAF50"/>
  
  <!-- Briefcase on counter -->
  <rect x="25" y="33" width="10" height="6" rx="1" fill="#8D6E63"/>
  <rect x="27" y="35" width="6" height="2" rx="1" fill="#5D4037"/>
  <rect x="28" y="37" width="4" height="1" fill="#5D4037"/>
  
  <!-- Counter top detail -->
  <rect x="8" y="35" width="44" height="2" fill="#1976D2"/>
</svg>
