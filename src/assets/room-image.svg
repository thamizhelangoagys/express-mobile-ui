<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradients for photographic look -->
  <defs>
    <linearGradient id="wallGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#94a3b8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headboardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b08968;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5a2b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chairGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="windowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b3e5fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#81d4fa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lampGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fde68a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Room background with photographic lighting -->
  <rect width="400" height="300" fill="url(#wallGradient)"/>
  
  <!-- Ambient lighting effect -->
  <circle cx="200" cy="150" r="200" fill="url(#lightGradient)"/>
  
  <!-- Floor with perspective -->
  <rect x="0" y="250" width="400" height="50" fill="url(#floorGradient)"/>
  
  <!-- Large window with natural light -->
  <rect x="280" y="60" width="100" height="120" fill="url(#windowGradient)" stroke="#1e3a8a" stroke-width="1"/>
  <rect x="285" y="65" width="90" height="110" fill="url(#windowGradient)"/>
  
  <!-- Window frame and mullions -->
  <rect x="330" y="65" width="2" height="110" fill="#1e3a8a"/>
  <rect x="285" y="120" width="90" height="2" fill="#1e3a8a"/>
  
  <!-- Elegant curtains -->
  <rect x="280" y="60" width="15" height="120" fill="#1e3a8a" opacity="0.4"/>
  <rect x="365" y="60" width="15" height="120" fill="#1e3a8a" opacity="0.4"/>
  
  <!-- Large king-size bed -->
  <rect x="60" y="140" width="200" height="80" fill="url(#bedGradient)" rx="8"/>
  <rect x="65" y="145" width="190" height="70" fill="url(#bedGradient)" rx="4"/>
  
  <!-- Elegant headboard -->
  <rect x="60" y="120" width="200" height="25" fill="url(#headboardGradient)" rx="8"/>
  
  <!-- Multiple pillows for luxury look -->
  <rect x="75" y="150" width="40" height="30" fill="white" rx="8"/>
  <rect x="120" y="150" width="40" height="30" fill="white" rx="8"/>
  <rect x="165" y="150" width="40" height="30" fill="white" rx="8"/>
  
  <!-- Decorative throw pillow -->
  <rect x="75" y="180" width="130" height="20" fill="#f3f4f6" rx="6"/>
  
  <!-- Bedside tables with lamps -->
  <rect x="270" y="160" width="50" height="55" fill="#8b5cf6" rx="8"/>
  <rect x="275" y="165" width="40" height="45" fill="#a78bfa" rx="4"/>
  
  <!-- Warm bedside lamp -->
  <circle cx="295" cy="175" r="12" fill="url(#lampGradient)"/>
  <rect x="293" y="175" width="4" height="25" fill="#6b7280"/>
  <rect x="290" y="200" width="10" height="4" fill="#6b7280"/>
  
  <!-- Second bedside table -->
  <rect x="80" y="160" width="50" height="55" fill="#8b5cf6" rx="8"/>
  <rect x="85" y="165" width="40" height="45" fill="#a78bfa" rx="4"/>
  
  <!-- Second lamp -->
  <circle cx="105" cy="175" r="12" fill="url(#lampGradient)"/>
  <rect x="103" y="175" width="4" height="25" fill="#6b7280"/>
  <rect x="100" y="200" width="10" height="4" fill="#6b7280"/>
  
  <!-- Seating area with elegant armchairs -->
  <rect x="60" y="80" width="55" height="55" fill="url(#chairGradient)" rx="10"/>
  <rect x="65" y="85" width="45" height="45" fill="#60a5fa" rx="6"/>
  
  <rect x="125" y="80" width="55" height="55" fill="url(#chairGradient)" rx="10"/>
  <rect x="130" y="85" width="45" height="45" fill="#60a5fa" rx="6"/>
  
  <!-- Coffee table with decorative elements -->
  <rect x="85" y="100" width="70" height="30" fill="#f59e0b" rx="8"/>
  <rect x="90" y="105" width="60" height="20" fill="#fbbf24" rx="4"/>
  
  <!-- Vase with flowers -->
  <rect x="110" y="95" width="12" height="20" fill="#8b5cf6" rx="3"/>
  <circle cx="116" cy="90" r="4" fill="#ef4444"/>
  <circle cx="114" cy="88" r="3" fill="#fca5a5"/>
  <circle cx="118" cy="88" r="3" fill="#fca5a5"/>
  <circle cx="116" cy="86" r="2" fill="#fecaca"/>
  
  <!-- Bench at foot of bed -->
  <rect x="60" y="200" width="200" height="18" fill="#d1d5db" rx="6"/>
  <rect x="65" y="203" width="190" height="12" fill="#e5e7eb" rx="3"/>
  
  <!-- Wall art -->
  <rect x="320" y="70" width="45" height="30" fill="#ef4444" rx="4"/>
  <rect x="325" y="75" width="35" height="20" fill="#fca5a5" rx="2"/>
  
  <!-- Patterned area rug -->
  <rect x="50" y="230" width="300" height="20" fill="#f3f4f6" rx="6"/>
  <rect x="60" y="235" width="280" height="10" fill="#e5e7eb" rx="3"/>
  
  <!-- Subtle shadows for depth -->
  <rect x="0" y="0" width="400" height="300" fill="url(#wallGradient)" opacity="0.05"/>
  
  <!-- Highlight effects for photographic look -->
  <circle cx="295" cy="175" r="8" fill="white" opacity="0.3"/>
  <circle cx="105" cy="175" r="8" fill="white" opacity="0.3"/>
</svg>
