<div class="modal-overlay" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="modal-header">
      <h2 class="modal-title">Add New Card</h2>
      <button class="close-btn" (click)="closeModal()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Card Form -->
    <form [formGroup]="cardForm" (ngSubmit)="submitCard()" class="card-form">
      <!-- Card Number -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Card Number</mat-label>
        <input 
          matInput 
          formControlName="cardNumber" 
          placeholder="1234 5678 9012 3456"
          maxlength="19"
          (input)="formatCardNumber($event)">
        <mat-icon matSuffix>credit_card</mat-icon>
        <mat-error *ngIf="cardForm.get('cardNumber')?.hasError('required')">
          Card number is required
        </mat-error>
        <mat-error *ngIf="cardForm.get('cardNumber')?.hasError('pattern')">
          Please enter a valid card number
        </mat-error>
      </mat-form-field>

      <!-- Cardholder Name -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Cardholder Name</mat-label>
        <input 
          matInput 
          formControlName="cardholderName" 
          placeholder="John Doe">
        <mat-icon matSuffix>person</mat-icon>
        <mat-error *ngIf="cardForm.get('cardholderName')?.hasError('required')">
          Cardholder name is required
        </mat-error>
      </mat-form-field>

      <!-- Expiry and CVV Row -->
      <div class="form-row">
        <!-- Expiry Month -->
        <mat-form-field appearance="outline" class="form-field half">
          <mat-label>Month</mat-label>
          <mat-select formControlName="expiryMonth">
            <mat-option *ngFor="let month of months" [value]="month.value">
              {{ month.label }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="cardForm.get('expiryMonth')?.hasError('required')">
            Month is required
          </mat-error>
        </mat-form-field>

        <!-- Expiry Year -->
        <mat-form-field appearance="outline" class="form-field half">
          <mat-label>Year</mat-label>
          <mat-select formControlName="expiryYear">
            <mat-option *ngFor="let year of years" [value]="year">
              {{ year }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="cardForm.get('expiryYear')?.hasError('required')">
            Year is required
          </mat-error>
        </mat-form-field>
      </div>

      <!-- CVV -->
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>CVV</mat-label>
        <input 
          matInput 
          formControlName="cvv" 
          placeholder="123"
          maxlength="4"
          type="password">
        <mat-icon matSuffix>security</mat-icon>
        <mat-error *ngIf="cardForm.get('cvv')?.hasError('required')">
          CVV is required
        </mat-error>
        <mat-error *ngIf="cardForm.get('cvv')?.hasError('pattern')">
          Please enter a valid CVV
        </mat-error>
      </mat-form-field>

      <!-- Add Card Button -->
      <div class="add-card-section">
        <button 
          mat-raised-button 
          color="primary" 
          class="add-card-btn" 
          type="submit"
          [disabled]="!cardForm.valid">
          Add Card
        </button>
      </div>
    </form>
  </div>
</div>
