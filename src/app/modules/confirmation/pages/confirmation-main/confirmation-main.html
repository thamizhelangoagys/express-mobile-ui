<p>confirmation-main works!</p>
<div class="confirmation-container">
	<h1>Check-In Confirmation</h1>
	<mat-card>
		<mat-card-title>Success!</mat-card-title>
		<mat-card-content>
			<p>You have successfully checked in.</p>
			<p>Location: [Location]</p>
			<p>Time: [Time]</p>
		</mat-card-content>
		<mat-card-actions>
			<button mat-raised-button color="primary" routerLink="/dashboard">Go to Dashboard</button>
			<button mat-button routerLink="/history">View History</button>
		</mat-card-actions>
	</mat-card>
</div>
