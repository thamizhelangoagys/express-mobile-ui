<p>history-main works!</p>
<div class="history-container">
	<h1>Check-In/Out History</h1>
	<table mat-table [dataSource]="[]" class="mat-elevation-z8">
		<ng-container matColumnDef="date">
			<th mat-header-cell *matHeaderCellDef>Date</th>
			<td mat-cell *matCellDef="let element">{{element.date}}</td>
		</ng-container>
		<ng-container matColumnDef="location">
			<th mat-header-cell *matHeaderCellDef>Location</th>
			<td mat-cell *matCellDef="let element">{{element.location}}</td>
		</ng-container>
		<ng-container matColumnDef="action">
			<th mat-header-cell *matHeaderCellDef>Action</th>
			<td mat-cell *matCellDef="let element">{{element.action}}</td>
		</ng-container>
		<tr mat-header-row *matHeaderRowDef="['date', 'location', 'action']"></tr>
		<tr mat-row *matRowDef="let row; columns: ['date', 'location', 'action'];"></tr>
	</table>
</div>
