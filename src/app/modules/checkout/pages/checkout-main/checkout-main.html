<div class="checkout-container">
	<h1>Start Check-Out</h1>
	<form class="checkout-form">
		<mat-form-field appearance="fill">
			<mat-label>Location</mat-label>
			<input matInput placeholder="Select location" required>
		</mat-form-field>
		<mat-form-field appearance="fill">
			<mat-label>Date & Time</mat-label>
			<input matInput type="datetime-local" required>
		</mat-form-field>
		<mat-form-field appearance="fill">
			<mat-label>User</mat-label>
			<input matInput placeholder="Enter your name" required>
		</mat-form-field>
		<button mat-raised-button color="accent" type="submit">Check Out</button>
	</form>
</div>
